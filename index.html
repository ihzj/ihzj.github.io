<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        /* --- 全局变量与重置 --- */
        :root {
            --primary-color: #ff9900; /* 经典QQ橙 */
            --secondary-color: #ffcc00; /* 亮黄 */
            --text-dark: #333333;
            --text-light: #666666;
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* --- 顶部 Hero 区域 (背景图) --- */
        .hero-banner {
            height: 300px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); 
            /* 这里可以换成你喜欢的图片URL */
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* --- 主容器 --- */
        .container {
            max-width: 900px;
            margin: -80px auto 40px; /* 负边距实现卡片上浮效果 */
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* --- 个人信息卡片 --- */
        .profile-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            margin-top: -100px; /* 让头像突出一部分到Banner上 */
            background-color: #eee;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            margin: 15px 0 5px;
            color: var(--text-dark);
        }

        .bio {
            color: var(--text-light);
            font-size: 16px;
            margin-bottom: 25px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- 社交按钮 --- */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #ddd;
            color: var(--text-light);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* --- 内容网格 (关于我/作品) --- */
        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .info-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
            display: flex;
            align-items: center;
        }

        /* --- 技能标签 --- */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: #fff5e6; /* 浅橙色背景 */
            color: #d67d00;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        /* --- 时间轴/动态 --- */
        .timeline-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #eee;
        }
        .timeline-item:last-child { border-bottom: none; }
        
        .date {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            display: block;
        }

        /* --- 底部 --- */
        footer {
            text-align: center;
            padding: 40px 0;
            color: #999;
            font-size: 13px;
        }

        /* --- 响应式微调 --- */
        @media (max-width: 600px) {
            .hero-banner { height: 200px; }
            .avatar { width: 100px; height: 100px; margin-top: -50px; }
            .container { margin-top: -50px; }
        }
    </style>
</head>
<body>

    <!-- 顶部背景图 -->
    <div class="hero-banner"></div>

    <div class="container">
        <!-- 核心个人资料卡片 -->
        <div class="profile-card">
            <!-- 请替换下面的 src 为你的头像链接 -->
            <img src="https://ui-avatars.com/api/?name=User&background=random&size=256" alt="Avatar" class="avatar">
            
            <h1 class="name">轻舞飞扬</h1>
            <p class="bio">热爱生活，记录点滴。一个喜欢摄影和编程的互联网观察者。</p>
            
            <div class="social-links">
                <button class="btn btn-primary">关注我</button>
                <button class="btn btn-outline">发私信</button>
            </div>
        </div>

        <!-- 下方双栏布局 -->
        <div class="grid-section">
            
            <!-- 左侧：关于我/技能 -->
            <div class="info-box">
                <div class="section-title">关于我</div>
                <p style="margin-bottom: 20px; color: #666;">
                    这里是你的详细介绍区域。你可以写你的兴趣爱好、职业背景或者任何想说的话。保持简洁明了最好。
                </p>
                
                <div class="section-title" style="font-size: 16px; margin-top: 30px;">技能标签</div>
                <div class="tags">
                    <span class="tag">HTML/CSS</span>
                    <span class="tag">摄影</span>
                    <span class="tag">旅行</span>
                    <span class="tag">写作</span>
                    <span class="tag">视频剪辑</span>
                </div>
            </div>

            <!-- 右侧：最新动态/作品 -->
            <div class="info-box">
                <div class="section-title">最新动态</div>
                
                <div class="timeline-item">
                    <span class="date">2023-10-24</span>
                    <p>今天天气真不错，去公园拍了一组秋日的照片，感觉光影很棒。</p>
                </div>

                <div class="timeline-item">
                    <span class="date">2023-10-20</span>
                    <p>终于把这个个人主页的代码写完了，采用了经典的橙色调，致敬那个年代。</p>
                </div>

                <div class="timeline-item">
                    <span class="date">2023-10-15</span>
                    <p>分享一首好听的歌：《晴天》。</p>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2023 轻舞飞扬的个人主页 | Powered by Simple Code</p>
    </footer>

</body>
</html>
