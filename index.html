<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>简·博客</title>
  <!-- 简洁图标库，仅用于必要的小元素 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: 'Inter', 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      line-height: 1.5;
      display: flex;
      justify-content: center;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    /* 极简容器：最大宽度限制，保证阅读舒适度 */
    .blog {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    /* 头部：干净利落的标题与导航 */
    .header {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      border-bottom: 1px solid #eaeaea;
      padding-bottom: 1.8rem;
    }

    .site-title {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #0a0a0a;
      margin: 0;
      line-height: 1.2;
    }

    .site-desc {
      font-size: 0.95rem;
      color: #5c5c5c;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    .nav {
      display: flex;
      gap: 2rem;
      margin-top: 0.3rem;
    }

    .nav a {
      text-decoration: none;
      color: #4a4a4a;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
    }

    .nav a:hover {
      color: #000;
      border-bottom-color: #000;
    }

    /* 文章列表：极度简化，去除卡片背景 */
    .posts {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
    }

    .post {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 1.8rem;
    }

    .post:last-child {
      border-bottom: none;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.8rem;
      color: #8a8a8a;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-weight: 500;
    }

    .post-date {
      color: #6b6b6b;
    }

    .post-tag {
      background: #f5f5f5;
      padding: 0.15rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
      color: #3d3d3d;
      font-weight: 500;
    }

    .post-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0a0a0a;
      line-height: 1.3;
      margin: 0.2rem 0 0.1rem;
      letter-spacing: -0.2px;
    }

    .post-title a {
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }

    .post-title a:hover {
      opacity: 0.7;
    }

    .post-excerpt {
      font-size: 0.95rem;
      color: #4d4d4d;
      line-height: 1.6;
      margin: 0.2rem 0 0.5rem;
    }

    .read-link {
      font-size: 0.85rem;
      font-weight: 500;
      color: #1a1a1a;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      border-bottom: 1px solid #d0d0d0;
      width: fit-content;
      transition: border-color 0.2s;
    }

    .read-link i {
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    .read-link:hover {
      border-bottom-color: #000;
    }

    .read-link:hover i {
      transform: translateX(3px);
    }

    /* 关于作者简洁区块 */
    .about-mini {
      background: #fafafa;
      border-radius: 8px;
      padding: 1.2rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0.5rem 0 0.8rem;
      border: 1px solid #f0f0f0;
    }

    .avatar-small {
      width: 44px;
      height: 44px;
      background: #e0e0e0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a3a3a;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .about-text {
      font-size: 0.9rem;
      color: #3d3d3d;
      line-height: 1.4;
    }

    .about-text strong {
      font-weight: 600;
      color: #0a0a0a;
    }

    .footer {
      margin-top: 1rem;
      text-align: center;
      color: #8a8a8a;
      font-size: 0.8rem;
      border-top: 1px solid #eeeeee;
      padding-top: 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .social-links {
      display: flex;
      gap: 1.2rem;
    }

    .social-links a {
      color: #5c5c5c;
      font-size: 1rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .social-links a:hover {
      color: #000;
    }

    @media (max-width: 500px) {
      body {
        padding: 1.5rem 1rem;
      }
      .site-title {
        font-size: 1.8rem;
      }
      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="blog">
    <!-- 极简头部 -->
    <header class="header">
      <div>
        <h1 class="site-title">简·博客</h1>
        <p class="site-desc">写干净的文字，做简单的记录。</p>
      </div>
      <nav class="nav">
        <a href="#">文章</a>
        <a href="#">关于</a>
        <a href="#">订阅</a>
        <a href="#">联系</a>
      </nav>
    </header>

    <!-- 轻量关于区块 -->
    <div class="about-mini">
      <div class="avatar-small">
        <i class="fas fa-user"></i>
      </div>
      <div class="about-text">
        <strong>林一</strong> · 开发者 & 写作者。这里没有复杂的设计，只有思考与记录。
      </div>
    </div>

    <!-- 文章列表：简洁到极致 -->
    <main class="posts">
      <article class="post">
        <div class="post-meta">
          <span class="post-date">2026年8月3日</span>
          <span class="post-tag">技术</span>
        </div>
        <h2 class="post-title">
          <a href="#">回归简单的网页设计哲学</a>
        </h2>
        <p class="post-excerpt">少即是多。为什么我们不再需要复杂的阴影和动画，以及如何用最少的元素构建舒适的阅读体验。</p>
        <a href="#" class="read-link">阅读 <i class="fas fa-arrow-right"></i></a>
      </article>

      <article class="post">
        <div class="post-meta">
          <span class="post-date">2026年7月29日</span>
          <span class="post-tag">随笔</span>
        </div>
        <h2 class="post-title">
          <a href="#">雨天的咖啡馆与代码</a>
        </h2>
        <p class="post-excerpt">一个下午的远程工作记录。关于专注、环境音，以及如何在不完美中保持节奏。</p>
        <a href="#" class="read-link">阅读 <i class="fas fa-arrow-right"></i></a>
      </article>

      <article class="post">
        <div class="post-meta">
          <span class="post-date">2026年7月24日</span>
          <span class="post-tag">阅读</span>
        </div>
        <h2 class="post-title">
          <a href="#">《深度工作》笔记：重新获得专注</a>
        </h2>
        <p class="post-excerpt">在碎片化时代，深度工作是一种稀缺能力。摘录与个人实践总结。</p>
        <a href="#" class="read-link">阅读 <i class="fas fa-arrow-right"></i></a>
      </article>
    </main>

    <!-- 页脚：极简版权与社交 -->
    <footer class="footer">
      <span>© 2026 简·博客</span>
      <div class="social-links">
        <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="#" aria-label="邮件"><i class="far fa-envelope"></i></a>
        <a href="#" aria-label="RSS"><i class="fas fa-rss"></i></a>
      </div>
    </footer>
  </div>
</body>
