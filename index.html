<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>简·博客</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      font-family: 'Inter', 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      color: #111;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem;
      min-height: 100vh;
    }

    .blog {
      max-width: 620px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2.8rem;
    }

    /* 头部：仅文字，无任何装饰 */
    .header {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .site-title {
      font-size: 1.8rem;
      font-weight: 650;
      letter-spacing: -0.3px;
      color: #000;
    }

    .nav {
      display: flex;
      gap: 1.8rem;
    }

    .nav a {
      text-decoration: none;
      color: #666;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav a:hover {
      color: #000;
    }

    /* 文章列表：仅靠间距区分 */
    .posts {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .post {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .post-date {
      font-size: 0.8rem;
      color: #999;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .post-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #000;
      line-height: 1.3;
    }

    .post-title a {
      text-decoration: none;
      color: inherit;
    }

    .post-title a:hover {
      opacity: 0.65;
    }

    .post-excerpt {
      font-size: 0.9rem;
      color: #555;
      line-height: 1.5;
    }

    /* 页脚：极简文字 */
    .footer {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .footer a {
      color: #888;
      text-decoration: none;
      margin-left: 1.2rem;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: #000;
    }

    @media (max-width: 500px) {
      body {
        padding: 2rem 1rem;
      }
      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
      .footer a {
        margin-left: 0;
        margin-right: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="blog">
    <header class="header">
      <div class="site-title">简·博客</div>
      <nav class="nav">
        <a href="#">文章</a>
        <a href="#">关于</a>
        <a href="#">联系</a>
      </nav>
    </header>

    <main class="posts">
      <article class="post">
        <div class="post-date">2026年8月3日</div>
        <h2 class="post-title">
          <a href="#">回归简单的网页设计哲学</a>
        </h2>
        <p class="post-excerpt">少即是多。为什么我们不再需要复杂的阴影和动画，以及如何用最少的元素构建舒适的阅读体验。</p>
      </article>

      <article class="post">
        <div class="post-date">2026年7月29日</div>
        <h2 class="post-title">
          <a href="#">雨天的咖啡馆与代码</a>
        </h2>
        <p class="post-excerpt">一个下午的远程工作记录。关于专注、环境音，以及如何在不完美中保持节奏。</p>
      </article>

      <article class="post">
        <div class="post-date">2026年7月24日</div>
        <h2 class="post-title">
          <a href="#">《深度工作》笔记：重新获得专注</a>
        </h2>
        <p class="post-excerpt">在碎片化时代，深度工作是一种稀缺能力。摘录与个人实践总结。</p>
      </article>
    </main>

    <footer class="footer">
      <span>© 2026 简·博客</span>
      <span>
        <a href="#">GitHub</a>
        <a href="#">邮件</a>
        <a href="#">RSS</a>
      </span>
    </footer>
  </div>
