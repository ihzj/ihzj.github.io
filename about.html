      <h1 class="page-title">关于本站</h1>
      <div class="page-content">
        <p>这是一个主打轻量阅读的个人博客，没有多余的弹窗、追踪脚本和冗余动画，只记录日常开发思考、读书笔记和生活碎片。</p>
        <p>建站的初衷是回归内容本身，用最简洁的页面设计，让每一段文字都能获得足够的注意力，给读者带来舒适的阅读体验。</p>
        <p>写博客这件事对我来说更像是一种思考的整理方式——把脑子里零散的想法沉淀成文字，是学习最好的途径之一。</p>
